<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/argos-symbol.png" />
    <meta name="description" content="ARGOS — Sistema inteligente de visión vial: detección de excesos de velocidad, evidencia verificable y revisión humana." />
    <title>ARGOS — Sistema Inteligente de Visión Vial</title>

  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="glass-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/><feGaussianBlur in="n" stdDeviation="2" result="nb"/><feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
