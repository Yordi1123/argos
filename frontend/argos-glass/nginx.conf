server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API y evidencias: el navegador solo habla con nginx, nginx con el backend
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Prueba de detección: la foto viaja en base64 dentro del JSON (nginx limita a 1 MB por defecto).
  # 15 MB = 10 MB de imagen (límite del servicio vision) + ~33 % de base64. Solo esta ruta.
  location = /api/vision/detectar {
    client_max_body_size 15m;
    proxy_pass http://backend:8000;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Recursos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: cualquier otra ruta devuelve index.html (que nunca se cachea)
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
