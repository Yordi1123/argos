# ARGOS · Servicios del sistema
#   db        PostgreSQL: eventos, estados, auditoría
#   backend   FastAPI: API REST y entrega de evidencias verificadas
#   frontend  React + TypeScript servido por nginx: panel de revisión
#
# El agente de captura (ESP32 por USB serial + cámara RTSP) corre FUERA de Docker,
# en la laptop, porque Docker Desktop en Windows/macOS no expone puertos USB.
# Escribe las fotos en ./data/evidencias y registra cada evento en el backend.

name: argos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argos}
      POSTGRES_USER: ${POSTGRES_USER:-argos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PUERTO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-argos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-argos}
      EVIDENCIAS_DIR: /data/evidencias
      CORS_ORIGENES: http://localhost:${PANEL_PUERTO:-8080}
      TZ: America/Lima
    volumes:
      - ./data/evidencias:/data/evidencias:ro   # solo lectura: el backend no altera evidencias
    ports:
      - "127.0.0.1:${API_PUERTO:-8000}:8000"    # el agente de captura llama aquí
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/argos-glass
    restart: unless-stopped
    ports:
      - "${PANEL_HOST:-127.0.0.1}:${PANEL_PUERTO:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
